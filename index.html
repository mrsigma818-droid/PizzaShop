<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikza Shop</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px;
            background: #222;
        }

        h1 {
            font-size: 45px;
            margin: 10px;
        }

        p {
            font-size: 20px;
        }

        .pizza {
            font-size: 90px;
            margin: 20px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #e63946;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
            margin-top: 20px;
        }

        .button:hover {
            background: #ff5964;
        }

        section {
            padding: 40px 20px;
        }

        footer {
            padding: 20px;
            background: #222;
            color: #aaa;
        }
    </style>
</head>

<body>

    <header>
        <div class="pizza">🍕</div>
        <h1>🍕 Pizza Shop</h1>
        <p>به پیتزا شاپ خوش آمدید!</p>
        <a class="button" href="#">مشاهده محصولات</a>
    </header>

    <section>
        <h2>پیتزاهای خوشمزه 🍕</h2>
        <p>به‌زودی بهترین پیتزاها و محصولات اینجا قرار می‌گیرند.</p>
    </section>

    <footer>
        © 2026 Pikza Shop
    </footer>

</body>
</html>
