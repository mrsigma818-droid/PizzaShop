<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🍕 pizzaShop | فروشگاه گیمینگ</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:#070707;
    color:white;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:18px 7%;
    background:rgba(10,10,10,.94);
    border-bottom:1px solid #292929;
    backdrop-filter:blur(15px);
}

.logo{
    font-size:25px;
    font-weight:bold;
    color:#ff9d00;
}

.logo span{
    color:white;
}

nav a{
    color:#aaa;
    text-decoration:none;
    margin:0 10px;
    transition:.2s;
    cursor:pointer;
}

nav a:hover{
    color:#ff9d00;
}

.hero{
    padding:90px 7%;
    text-align:center;
    background:
    radial-gradient(circle at center,#432900 0%,#171717 35%,#070707 75%);
}

.hero h1{
    font-size:48px;
    margin-bottom:18px;
}

.hero h1 span{
    color:#ff9d00;
}

.hero p{
    color:#aaa;
    font-size:17px;
    line-height:2;
}

.products{
    padding:55px 7%;
}

.products h2{
    text-align:center;
    font-size:31px;
    margin-bottom:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(230px,1fr));
    gap:24px;
}

.card{
    background:linear-gradient(145deg,#151515,#0f0f0f);
    border:1px solid #292929;
    border-radius:22px;
    padding:20px;
    transition:.3s;
    overflow:hidden;
}

.card:hover{
    transform:translateY(-8px);
    border-color:#ff9d00;
    box-shadow:0 15px 45px #000;
}

.icon{
    height:145px;
    border-radius:17px;
    background:
    radial-gradient(circle,#3b2605,#171717 65%);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:65px;
    margin-bottom:20px;
}

.card h3{
    font-size:20px;
    margin-bottom:10px;
}

.card p{
    color:#999;
    font-size:13px;
    line-height:1.9;
    min-height:50px;
}

.price{
    color:#ffb52e;
    font-size:20px;
    font-weight:bold;
    margin:20px 0;
}

.buy{
    width:100%;
    border:0;
    border-radius:12px;
    padding:14px;
    background:#ff9d00;
    color:#111;
    font-size:15px;
    font-weight:bold;
    cursor:pointer;
    transition:.2s;
}

.buy:hover{
    background:#ffc04d;
    transform:scale(1.03);
}

footer{
    margin-top:30px;
    padding:35px;
    text-align:center;
    color:#777;
    border-top:1px solid #222;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    z-index:1000;
    background:rgba(0,0,0,.8);
    align-items:center;
    justify-content:center;
    padding:20px;
}

.modal-box{
    width:min(440px,100%);
    background:#151515;
    border:1px solid #3a3a3a;
    border-radius:24px;
    padding:30px;
    text-align:center;
    box-shadow:0 25px 90px #000;
    animation:popup .25s ease;
}

@keyframes popup{
    from{
        opacity:0;
        transform:scale(.8) translateY(20px);
    }

    to{
        opacity:1;
        transform:scale(1) translateY(0);
    }
}
