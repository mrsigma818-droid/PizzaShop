<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pikza Shop</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            text-align: center;
        }

        header {
            padding: 40px 20px;
            background: #222;
        }

        h1 {
            font-size: 45px;
        }

        .pizza {
            font-size: 90px;
        }

        .button {
            display: inline-block;
            padding: 15px 30px;
            background: #e63946;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-size: 20px;
        }

        section {
            padding: 40px 20px;
        }

        .product {
            background: #222;
            margin: 20px auto;
            padding: 20px;
            border-radius: 15px;
            max-width: 350px;
        }

        .product h3 {
            font-size: 25px;
        }

        .price {
            color: #ff5964;
            font-size: 22px;
        }

        footer {
            padding: 20px;
            background: #222;
            color: #aaa;
        }
    </style>
</head>

<body>

<header>
    <div class="pizza">🍕</div>
    <h1>🍕 Pikza Shop</h1>
    <p>به پیکزا شاپ خوش آمدید!</p>

    <a class="button" href="#products">مشاهده محصولات</a>
</header>

<section id="products">
    <h2>🍕 محصولات ما</h2>

    <div class="product">
        <h3>پیتزا پپرونی 🍕</h3>
        <p>پیتزای خوشمزه با پپرونی</p>
        <div class="price">۱۵۰,۰۰۰ تومان</div>
    </div>

    <div class="product">
        <h3>پیتزا مخصوص 🍕</h3>
        <p>پیتزای مخصوص پیکزا شاپ</p>
        <div class="price">۱۸۰,۰۰۰ تومان</div>
    </div>

    <div class="product">
        <h3>پیتزا مرغ 🍕</h3>
        <p>پیتزا با مرغ و پنیر</p>
        <div class="price">۱۷۰,۰۰۰ تومان</div>
    </div>
</section>

<footer>
    © 2026 Pikza Shop
</footer>

</body>
</html>
